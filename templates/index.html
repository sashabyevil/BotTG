<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mizu Support</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0f172a;
    color: #e5e7eb;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
.header {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 16px 24px;
    font-size: 20px;
    font-weight: 700;
}
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 20px;
}
h2 {
    margin: 0 0 16px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
}
.user {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #1e293b;
    color: inherit;
    padding: 12px 16px;
    margin-bottom: 8px;
    border-radius: 12px;
    text-decoration: none;
    border: 1px solid transparent;
}
.user:hover {
    background: #273449;
    border-color: #334155;
}
.avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #fff;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}
.avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.info { min-width: 0; }
.name { font-weight: 600; }
.username { color: #64748b; font-size: 13px; margin-left: 6px; font-weight: normal; }
.last {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.empty { color: #64748b; text-align: center; margin-top: 40px; }
.header { display: flex; justify-content: space-between; align-items: center; }
.hlink {
    font-size: 14px;
    font-weight: normal;
    color: #cbd5e1;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 10px;
    background: #0f172a;
}
.hlink:hover { background: #334155; color: #fff; }
</style>
</head>
<body>

<div class="header"><span>Mizu Support</span><a class="hlink" href="/stickers">😊 Стикеры</a></div>

<div class="container">
    <h2>Диалоги</h2>

    {% for user in users %}
        <a class="user" href="/chat/{{ user['id'] }}">
            <div class="avatar">{{ user['name'][:1]|upper }}<img src="/avatar/{{ user['id'] }}" alt="" onerror="this.remove()"></div>
            <div class="info">
                <div class="name">{{ user['name'] }}{% if user['username'] %}<span class="username">@{{ user['username'] }}</span>{% endif %}</div>
                {% if user['last_message'] %}<div class="last">{{ user['last_message'] }}</div>{% endif %}
            </div>
        </a>
    {% else %}
        <div class="empty">Пока никто не написал боту.</div>
    {% endfor %}
</div>

</body>
</html>
