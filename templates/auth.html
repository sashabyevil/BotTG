<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} — Mizu Support</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e5e7eb;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
.box {
    width: 360px;
    max-width: 92vw;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 28px;
}
h1 { margin: 0 0 6px; font-size: 22px; }
.sub { color: #94a3b8; margin: 0 0 18px; font-size: 14px; line-height: 1.4; }
label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 6px; }
input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #fff;
    font-size: 15px;
    outline: none;
}
input:focus { border-color: #3b82f6; }
button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}
button:hover { background: #1d4ed8; }
.error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid #ef4444;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    margin-bottom: 8px;
}
</style>
</head>
<body>
<div class="box">
{% block content %}{% endblock %}
</div>
</body>
</html>
