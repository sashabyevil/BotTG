<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} — Mizu Support</title>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
.box {
    width: 360px;
    max-width: 92vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
}
h1 { margin: 0 0 6px; font-size: 22px; }
.sub { color: var(--text-2); margin: 0 0 18px; font-size: 14px; line-height: 1.4; }
label { display: block; font-size: 13px; color: var(--text-2); margin: 12px 0 6px; }
input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-strong);
    font-size: 15px;
    outline: none;
}
input:focus { border-color: var(--focus); }
button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}
button:hover { background: var(--accent-hover); }
.error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid #ef4444;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    margin-bottom: 8px;
}
</style>
</head>
<body>
<div class="box">
{% block content %}{% endblock %}
</div>
</body>
</html>
